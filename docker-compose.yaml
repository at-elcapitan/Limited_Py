services:
  next:
    restart: unless-stopped
    container_name: limitednext
    build:
      context: .
      dockerfile: ./Dockerfile
    links:
    - postgres
    - lavalink
    depends_on:
    - postgres
    - lavalink
    volumes:
    - ./.env:/opt/nxre/.env
    command: python atlb

  lavalink:
    build:
      context: ./lavalink
      dockerfile: Dockerfile
    container_name: lavalink
    restart: unless-stopped
    environment:
    - _JAVA_OPTIONS=-Xmx6G
    - SERVER_PORT=2333
    - LAVALINK_SERVER_PASSWORD=youshallnotpass
    volumes:
    - ./application.yml:/opt/Lavalink/application.yml
    expose:
    - 2333
    ports:
    - "2333:2333"
